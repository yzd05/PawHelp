[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pawhelp"
version = "1.1.0"
description = "E-commerce assistant with RAG, tools, persistent conversations and an offline knowledge flywheel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langfuse>=4.17,<5",
    "alembic>=1.16,<2",
    "asyncmy>=0.2,<1",
    "cryptography>=46,<47",
    "fastapi[standard]>=0.141,<1",
    "FlagEmbedding>=1.3,<2",
    "httpx>=0.28,<1",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=1.28,<2",
    "langchain-mcp-adapters>=0.2,<0.3",
    "jsonschema>=4.23,<5",
    "pydantic-settings>=2.15,<3",
    "pymilvus>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "torch==2.14.0",
    "typesafe-sdk>=0.7.5,<0.8",
    "uvicorn>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/yzd05/PawHelp"
Issues = "https://github.com/yzd05/PawHelp/issues"
Changelog = "https://github.com/yzd05/PawHelp/blob/main/CHANGELOG.md"

[project.scripts]
pawhelp-start = "scripts.start:main"

[project.optional-dependencies]
classifier = ["transformers==5.17.0", "accelerate==1.15.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*", "scripts*"]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-timeout>=2,<3",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
timeout = 60

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
